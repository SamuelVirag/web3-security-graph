name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy vault notes into content
        run: |
          rm -rf content
          mkdir content
          find notes -name '*.md' -exec cp {} content/ \;
          echo "Content files copied:" && ls content/ | wc -l
          echo "First 3 files:" && ls content/ | head -3
          echo "index.md exists:" && test -f content/index.md && echo "yes" || echo "no"

      - name: Build Quartz
        run: |
          echo "Content dir contents:" && ls -la content/ | head -5
          npx quartz build -d content -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
